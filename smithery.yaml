# Smithery configuration for DF-e
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_dfe

name: dfe-mcp
displayName: "DF-e"
description: >
  Puxa da **SEFAZ** os documentos fiscais eletrônicos emitidos **contra o seu CNPJ** (nota de fornecedor, CT-e e eventos), direto do **serviço oficial NFeDistribuicaoDFe**, com o **seu próprio certificado digital A1**. Sincronização incremental por NSU, com controle do limite de consultas para o seu CNPJ não ser bloqueado. Gera também o **DANFE em PDF** a partir do XML, que é o documento para imprimir ou anexar, porque a SEFAZ distribui XML e não PDF. Somente leitura. **Não afiliado à SEFAZ nem à Receita Federal.**

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/dfe-mcp
repository: https://github.com/mcp-dir/dfe-mcp

tags:
  - sefaz
  - nfe
  - dfe
  - danfe
  - cte
  - nota-fiscal
  - fiscal
  - accounting
  - brazil
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_dfe

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_dfe/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
